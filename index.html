<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basalio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
        }

        header {
            padding: 2rem;
            border-bottom: 1px solid #e5e5e5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .tagline {
            font-size: 1.1rem;
            color: #666;
        }

        main {
            padding: 4rem 2rem;
        }

        .hero {
            text-align: center;
            margin-bottom: 4rem;
        }

        .hero h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.1rem;
            color: #555;
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        .cta-button {
            display: inline-block;
            background: #000;
            color: #fff;
            padding: 1rem 2rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.3s;
        }

        .cta-button:hover {
            background: #333;
        }

        footer {
            padding: 2rem;
            border-top: 1px solid #e5e5e5;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .hero h2 {
                font-size: 1.5rem;
            }

            .container {
                padding: 0 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Basalio</h1>
            <p class="tagline">Coming soon</p>
        </div>
    </header>

    <main>
        <div class="container">
            <section class="hero">
                <h2>Something amazing is being built</h2>
                <p>Stay tuned for updates as we launch Basalio. We're working on something special.</p>
                <a href="mailto:contact@basalio.com" class="cta-button">Get in Touch</a>
            </section>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Basalio. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
