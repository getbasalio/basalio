name: Plugin Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Schedule against WordPress trunk later as a core-compatibility watchdog.
# (Intentionally left out for now; add a weekly cron once the initial run is clean.)

jobs:
  plugin-check:
    name: Plugin Check (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    services:
      mariadb:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: basalio_test
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, zip, zlib, gd, pdo_mysql, mysqli, dom, json, tokenizer, xml, xmlwriter, curl
          coverage: none
          tools: wp-cli

      - name: Verify PHP extensions
        run: php -m

      # setup-php's wp-cli tool install fails intermittently (exit 127 on `wp`).
      # Install the official phar ourselves when it is missing.
      - name: Ensure WP-CLI
        run: |
          if ! command -v wp >/dev/null 2>&1; then
            curl -fsSL --retry 3 -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
            sudo install -m 0755 /tmp/wp-cli.phar /usr/local/bin/wp
          fi
          wp --info

      - name: Download and install WordPress
        run: |
          mkdir -p /tmp/wordpress
          cd /tmp/wordpress
          wp core download --locale=en_US
          wp config create --dbname=basalio_test --dbuser=root --dbpass=root --dbhost=127.0.0.1 --dbprefix=wp_ --skip-check
          wp db create || true
          wp core install --url=http://localhost:8091 --title="Basalio Test" --admin_user=admin --admin_password=password123 --admin_email=admin@example.com

      - name: Build distributable ZIP from committed HEAD
        run: |
          bash "${{ github.workspace }}/scripts/build-zip.sh" /tmp/basalio-build-out
          mkdir -p /tmp/basalio-zip
          unzip -q /tmp/basalio-build-out/basalio-*.zip -d /tmp/basalio-zip

      - name: Install Basalio plugin from built ZIP
        run: |
          mkdir -p /tmp/wordpress/wp-content/plugins/basalio
          cp -R /tmp/basalio-zip/basalio/* /tmp/wordpress/wp-content/plugins/basalio/
          cd /tmp/wordpress
          wp plugin activate basalio

      - name: Install Plugin Check
        run: |
          cd /tmp/wordpress
          wp plugin install plugin-check --activate

      - name: Create verification fixtures
        run: php ${{ github.workspace }}/tests/make-verify-pages.php /tmp/wordpress

      - name: Verify output safety
        run: php ${{ github.workspace }}/tests/verify-output-safety.php /tmp/wordpress | tee /tmp/output-safety-${{ matrix.php }}.log

      - name: Run verify-fixes.php
        run: |
          # Tests are excluded from the distributable ZIP; run them from the checkout.
          php ${{ github.workspace }}/tests/verify-fixes.php /tmp/wordpress | tee /tmp/verify-fixes-${{ matrix.php }}.log

      - name: Run verify-all-schemas.php
        run: |
          php ${{ github.workspace }}/tests/verify-all-schemas.php /tmp/wordpress | tee /tmp/verify-all-schemas-${{ matrix.php }}.log

      - name: Run Plugin Check against built ZIP
        id: pcp
        run: |
          cd /tmp/wordpress
          wp plugin check /tmp/basalio-zip/basalio --format=csv > /tmp/plugin-check-${{ matrix.php }}.csv 2> /tmp/plugin-check-${{ matrix.php }}.err
          # Also produce a human-readable table for the log.
          wp plugin check /tmp/basalio-zip/basalio --format=table | tee /tmp/plugin-check-${{ matrix.php }}.log

      - name: Fail on Plugin Check Errors
        run: |
          echo "Checking Plugin Check CSV for errors..."
          python3 << 'PYEOF'
          import csv
          import sys

          errors = []
          warnings = []
          current_file = None

          with open('/tmp/plugin-check-${{ matrix.php }}.csv', encoding='utf-8', newline='') as f:
              reader = csv.reader(f)
              for row in reader:
                  if not row:
                      continue

                  # FILE: prefix lines introduce a new file section.
                  if len(row) == 1 and row[0].startswith('FILE:'):
                      current_file = row[0].split(':', 1)[1].strip()
                      continue

                  # Skip the repeated header rows inside each file section.
                  if row[0] == 'line':
                      continue

                  # Skip any non-data rows that do not have enough columns.
                  if len(row) < 5:
                      continue

                  row_type = row[2].upper()
                  code = row[3]
                  message = row[4]
                  entry = {'file': current_file, 'code': code, 'message': message}
                  if row_type == 'ERROR':
                      errors.append(entry)
                  elif row_type == 'WARNING':
                      warnings.append(entry)

          print(f'Plugin Check results: {len(errors)} error(s), {len(warnings)} warning(s).')
          for w in warnings:
              print(f"WARNING: {w['code']} - {w['message']} ({w['file']})")
          if errors:
              for e in errors[:20]:
                  print(f"ERROR: {e['code']} - {e['message']} ({e['file']})")
              sys.exit(1)
          PYEOF
          echo "No Plugin Check Errors."

      - name: Upload results
        uses: actions/upload-artifact@v5
        with:
          name: plugin-check-results-php-${{ matrix.php }}
          path: |
            /tmp/plugin-check-${{ matrix.php }}.csv
            /tmp/plugin-check-${{ matrix.php }}.log
            /tmp/plugin-check-${{ matrix.php }}.err
            /tmp/verify-fixes-${{ matrix.php }}.log
            /tmp/verify-all-schemas-${{ matrix.php }}.log
            /tmp/output-safety-${{ matrix.php }}.log
